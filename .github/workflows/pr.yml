name: pr

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/lint.yml@v1

  test_mvn:
    permissions:
      contents: read
    uses: ORCID-dev/public-reusable-workflows/.github/workflows/build.yml@v1
    with:
      name: test_mvn
      modules: >-
        ["orcid-message-listener", "orcid-activemq", "orcid-api-web", "orcid-internal-api", "orcid-pub-web",
        "orcid-scheduler-web", "orcid-web", "orcid-utils", "orcid-core", "orcid-persistence", "orcid-api-common"]
      java-version: '21'
      run: |
        mvn -T 1C install -DskipTests --projects "$MODULE" --also-make
        mvn -T 1C test --projects "$MODULE" --fail-at-end
